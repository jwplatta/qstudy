[project]
name = "qstudy"
version = "0.1.0"
description = "Backtesting tools for fast cross-sectional equity research and experiment iteration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joseph Platta", email = "jwplatta@gmail.com" }]
license = "MIT"
keywords = ["quant", "backtesting", "equities", "research", "systematic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "backtrader>=1.9.78.123",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "mplfinance>=0.12.10b0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "ta>=0.11.0",
    "streamlit>=1.50.0",
    "python-dotenv>=1.0.1",
    "scikit-learn",
    "lean",
    "simfin>=1.0.1",
    "yfinance",
    "seaborn",
    "statsmodels",
    "fredapi",
    "tqdm>=4.67.3",
]

[project.urls]
Homepage = "https://github.com/jwplatta/qstudy"
Repository = "https://github.com/jwplatta/qstudy"
Issues = "https://github.com/jwplatta/qstudy/issues"

[project.scripts]
qstudy = "qstudy.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qstudy"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
